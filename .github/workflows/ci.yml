name: CI

# A change to documentation alone builds and tests nothing: CI runs when
# anything else changes, with the documentation or without it. A tag runs
# nothing either: GitHub applies no path filter to a tag, which would test
# again a commit its branch has tested, so that a push names branches alone.
on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
      - "LICENSE"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format and vet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # The newest Go: gofmt parses every file, the ones only a newer Go
      # builds too -- generic methods, behind //go:build go1.27 -- which an
      # older gofmt cannot.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Check formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "The following files need gofmt:"
            echo "$files"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
          # arm64 on Linux: the interpreter's arm64 build, on runners
          # that are easier to get than macOS's.
          - ubuntu-24.04-arm
    steps:
      # The machine, as the native boundary's jobs print it: a Windows
      # runner's wrong answers in the VM's tests, which no other machine
      # reproduces, are told from a change's by its CPU.
      - name: Machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-CimInstance Win32_Processor
          "CPU: " + $p.Name + " | " + $p.Caption
          "OS: " + (Get-CimInstance Win32_OperatingSystem).Version

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

      # The VM's tests with the JIT made to compile on the first call and
      # in the background, each compile installed at the third check after
      # it was handed over (QJS_JIT_STRESS's background). It runs here
      # rather than beside the JIT's test262, whose job it made the
      # longest of the run: the jobs are as many as before, each shorter.
      - name: Run the VM's tests, compiling in the background
        shell: bash
        env:
          CGO_ENABLED: "0"
          QUICKJS_REQUIRE_JIT: "1"
          QJS_JIT_STRESS: threshold,budget=3,deopt=7,background=3
        run: go test -tags quickjs_jit -count=1 -timeout 30m ./internal/vm .

  newest:
    # The module builds with the Go go.mod names, which the jobs above test;
    # this one tests what only a newer Go builds as well.
    name: Test (Go 1.27)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run tests
        run: go test -count=1 ./...

  # Every target builds, plain and with the JIT's tag, whatever builds it
  # natively: an int is 32 bits on 386 and arm, where a constant past it
  # fails the build (the spill slots' heaps had packed a gap and an index
  # into an int), and a length past an int32 is checked on 386.
  portability:
    name: Portability builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build every target, plain and with the JIT
        run: |
          set -e
          for target in linux/386 linux/arm windows/amd64 windows/arm64 darwin/arm64 linux/arm64; do
            for tags in "" "quickjs_jit"; do
              echo "== $target ${tags:-plain}"
              GOOS=${target%/*} GOARCH=${target#*/} go build -tags "$tags" ./...
            done
          done

      - name: Test lengths past an int32 on 386
        run: GOARCH=386 go test . -run TestLengthsPastAnInt32

  # Go 1.27's loop invariant pass moves unsafe.Add's sums out of the branch
  # that guards them, which with a nil base leaves nil+32 in a pointer slot
  # live across calls (jitSortCopy's a.extAt()). hoistcheck builds the
  # toolchain's compiler with a report of each sum the pass moves, builds
  # every package and test binary with it, with and without the JIT and
  # checkptr, and fails for a sum it does not know to be safe.
  loop-hoists:
    name: Loop-invariant pointer sums (Go 1.27)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Check the sums the compiler moves
        run: go run ./internal/cmd/hoistcheck

  native-boundary:
    name: Native boundary (${{ matrix.os }}, Go ${{ matrix.go }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, ubuntu-24.04-arm]
        go: ["1.24", "1.27"]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      # The machine, first, which a failure on a Windows runner needs:
      # a few of them have met corrupted memory ("found pointer to free
      # object") in the steps below, in Check encodings and in Exercise
      # native execution, which no other runner has in a thousand runs.
      - name: Machine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Get-CimInstance Win32_Processor
          "CPU: " + $p.Name + " | " + $p.Caption
          "OS: " + (Get-CimInstance Win32_OperatingSystem).Version

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Check native code and assembly
        run: go vet -tags quickjs_jit ./internal/jit/... ./internal/vm

      # Native execution; the compiler's cross-checks -- liveness against
      # its reference, the origins and stores' checks it keeps against
      # those made afresh -- and native pointer lifetimes, in two lanes at
      # once: native pointer lifetimes (checkptr), the longest, beside
      # native execution and then the cross-checks, about as long
      # together. The vm package's tests run mostly one at a time -- its
      # heavy tests are serial -- so that one command used little more
      # than one of the runner's CPUs, and the three one after another had
      # taken slow runners past the job's 30 minutes. A lane stops at its
      # first failing command, as bash -e had the step stop; each lane's
      # output goes to a file, printed in full once both are done, so that
      # a failure reads as it did.
      - name: Exercise native execution, cross-check the compiler and native pointer lifetimes
        shell: bash
        run: |
          native=running lifetimes=running
          show() {
            echo "=== Native execution, then the compiler's cross-checks: exit $native"
            cat "$RUNNER_TEMP/native.log"
            echo "=== Native pointer lifetimes: exit $lifetimes"
            cat "$RUNNER_TEMP/checkptr.log"
          }
          # Cancelled at the job's timeout, the lanes' output so far.
          trap 'show; exit 1' INT TERM
          go test -tags quickjs_jit -gcflags=all=-d=checkptr=2 -count=1 -timeout=20m ./internal/jit/... ./internal/regexp ./internal/vm . -run 'JIT|Native|Program|Validate|Lower' > "$RUNNER_TEMP/checkptr.log" 2>&1 &
          checkptr=$!
          if { (go test -tags quickjs_jit -count=1 -timeout=10m ./internal/jit/... && go test -tags quickjs_jit -count=1 -timeout=10m ./internal/regexp -run Native && go test -tags quickjs_jit -count=1 -timeout=20m ./internal/vm . -run 'JIT|Native') && go test -tags quickjs_jit,quickjs_verify -count=1 -timeout=20m ./internal/jit/... ./internal/vm -run 'JIT|Native|SSA|Optimize|Build|Live'; } > "$RUNNER_TEMP/native.log" 2>&1; then native=0; else native=$?; fi
          if wait $checkptr; then lifetimes=0; else lifetimes=$?; fi
          trap - INT TERM
          show
          test $native -eq 0 && test $lifetimes -eq 0

      # Both emitters' code, for every target, against golang.org/x/arch's
      # disassemblers: a module of its own, so go-quickjs never depends on it.
      - name: Check encodings
        working-directory: internal/jit/verify
        run: go test -tags quickjs_jit -count=1 ./...

  # The WebAssembly spec and threads suites, interpreted and with every
  # function compiled at its first call, and the interpreter and the JIT
  # compared over every spec module's exports.
  wasm-spec:
    name: WebAssembly spec tests (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, ubuntu-24.04-arm]
        arch: [native]
        include:
          - os: ubuntu-latest
            arch: "386"
    env:
      CGO_ENABLED: "0"
    steps:
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out the WebAssembly spec
        uses: actions/checkout@v4
        with:
          repository: WebAssembly/spec
          ref: f3268fa9dcb7d3a60d09546e743e7281e75cddb0
          path: wasm-spec

      - name: Check out the threads proposal
        uses: actions/checkout@v4
        with:
          repository: WebAssembly/threads
          ref: cc535ada1aa21cfaa3cabf3ac73b89acef78a0a0
          path: wasm-threads

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run the spec scripts
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "386" ]; then export GOARCH=386; fi
          WASM_SPEC_DIR="$GITHUB_WORKSPACE/wasm-spec" WASM_THREADS_DIR="$GITHUB_WORKSPACE/wasm-threads" go test ./wasm/internal/spectest ./wasm/internal/wast -count=1 -v 2>&1 | tee spec.log | grep -E "spec:|scripts parsed|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0

      # Every function compiled at its first call, where the wasm JIT runs
      # (amd64 on Linux and Windows, arm64 on macOS and Linux); then every
      # call of a function with loops going on natively from a loop's head
      # at its first back edge (WASM_JIT=osr); and the JIT checked against
      # the interpreter call by call.
      - name: Run the spec scripts under the JIT
        if: matrix.arch == 'native'
        shell: bash
        run: |
          WASM_JIT=eager WASM_SPEC_DIR="$GITHUB_WORKSPACE/wasm-spec" WASM_THREADS_DIR="$GITHUB_WORKSPACE/wasm-threads" go test -tags quickjs_jit ./wasm/internal/spectest ./wasm/internal/engine -count=1 -v 2>&1 | tee jit.log | grep -E "spec:|jit:|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0
          WASM_JIT=osr WASM_SPEC_DIR="$GITHUB_WORKSPACE/wasm-spec" WASM_THREADS_DIR="$GITHUB_WORKSPACE/wasm-threads" go test -tags quickjs_jit ./wasm/internal/spectest ./wasm/internal/engine -count=1 -v 2>&1 | tee osr.log | grep -E "spec:|jit:|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0
          WASM_SPEC_DIR="$GITHUB_WORKSPACE/wasm-spec" WASM_THREADS_DIR="$GITHUB_WORKSPACE/wasm-threads" go test -tags quickjs_jit ./wasm/internal/spectest -run TestJITDifferential -count=1 -v 2>&1 | tee diff.log | grep -E "modules|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0

  # test262 with the JIT made to compile on the first call, poll Go every
  # few back edges and finish in the interpreter from wherever it got to
  # (QJS_JIT_STRESS, internal/vm). The runner fails a run in which no
  # test ran native code.
  jit-conformance:
    name: JIT test262 under stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15, ubuntu-24.04-arm]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
      QJS_JIT_STRESS: threshold,budget=3,deopt=7
    steps:
      # test262 counts a source's bytes and line terminators: keep its LFs on
      # Windows.
      - name: Keep line endings
        run: git config --global core.autocrlf false

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check out test262
        uses: actions/checkout@v4
        with:
          repository: tc39/test262
          ref: e4fbf57745c6aae3d1f12f181ecef78b1665d812
          path: test262

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      # amd64 on Linux and Windows, arm64 on macOS and Linux.
      - name: Run test262
        shell: bash
        run: TEST262_DIR="$GITHUB_WORKSPACE/test262" go test -tags quickjs_jit ./conformance -run TestConformance -count=1 -timeout 35m -v -args -conformance.jit 2>&1 | tee test262.log | grep -E "test262:|native code ran|FAIL|^ok"; test "${PIPESTATUS[0]}" -eq 0

      # The VM's own tests under the same stress: those that count native
      # calls, exits and compiles take the JIT's own thresholds
      # (jitRuntimeForTest, jitDefaultsForTest); the rest run stressed. The
      # same tests compiling in the background run in the Test job.
      - name: Run the VM's tests
        shell: bash
        run: go test -tags quickjs_jit -count=1 -timeout 30m ./internal/vm

  # The JIT's kernels and the tree tier's, on arm64 (macOS and Linux)
  # and amd64 (Linux). A shared
  # runner's times are noisy, so the summary compares the tiers within one
  # run: medians, and the JIT's time over the tree tier's.
  jit-bench:
    name: JIT kernels (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/jit-wip'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15, ubuntu-24.04-arm]
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Run the kernels
        run: go test -tags quickjs_jit -run '^$' -bench '^BenchmarkJIT(NumericKernels|ArrayKernels|DenseKernels|NumericFields|HostRoundTrip|ScalarCalls)$' -benchtime 300ms -count 5 ./internal/vm | tee bench.txt

      # Each includes compiling, so it shows first use too.
      - name: Run the promotion benchmarks
        run: go test -tags quickjs_jit -run '^$' -bench '^BenchmarkJIT(CallPromotion|KernelPromotion)$' -benchtime 200ms -count 3 ./internal/vm | tee promotion.txt

      - name: Summarize
        shell: python
        run: |
          import collections, os, re, statistics

          def medians(path):
              runs = collections.defaultdict(list)
              for line in open(path):
                  m = re.match(r"(Benchmark\S+?)(?:-\d+)?\s+\d+\s+([\d.]+) ns/op", line)
                  if m:
                      runs[m.group(1)].append(float(m.group(2)))
              kernels = collections.defaultdict(dict)
              for name, times in runs.items():
                  kernel, mode = name.rsplit("/", 1)
                  kernels[kernel][mode] = statistics.median(times)
              return kernels

          rows = []  # name, tree, JIT
          for kernel, modes in sorted(medians("bench.txt").items()):
              if "ssa" in modes:
                  rows.append((kernel, modes.get("existing"), modes["ssa"]))
          for kernel, modes in sorted(medians("promotion.txt").items()):
              for mode in ("eager", "automatic"):
                  if mode in modes:
                      rows.append((f"{kernel}/{mode}", modes.get("existing"), modes[mode]))
          out = ["| Kernel | tree tier (us) | JIT (us) | JIT / tree |", "|---|---:|---:|---:|"]
          us = lambda t: f"{t / 1000:.1f}" if t else "-"
          for name, tree, jit in rows:
              ratio = f"{jit / tree:.2f}x" if tree else "-"
              out.append(f"| {name.removeprefix('BenchmarkJIT')} | {us(tree)} | {us(jit)} | {ratio} |")
          table = "\n".join(out)
          print(table)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(f"### {os.environ['RUNNER_OS']} {os.environ['RUNNER_ARCH']}\n\n{table}\n")

  # Generated programs, run in the interpreter, the tree tier and the JIT
  # under stress, must give the same answer.
  jit-fuzz:
    name: JIT differential fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CGO_ENABLED: "0"
      QUICKJS_REQUIRE_JIT: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true

      - name: Fuzz
        run: go test -tags quickjs_jit ./internal/vm -run '^$' -fuzz '^FuzzJITDifferential$' -fuzztime=5m

      # The input that failed, which the log does not show: the fuzzer
      # starts from the corpus the cache keeps, so a failure it finds in
      # CI may take hours to find again from the seeds alone.
      - name: Keep the failing input
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: internal/vm/testdata/fuzz/FuzzJITDifferential
          if-no-files-found: ignore

  race:
    name: Race detector
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test runtimes sharing go-intl's data
        run: go test -race -count=1 -run TestIntlConcurrentRuntimes .

      # The JIT's compiles on the process's workers, which share a compile
      # with the runtime's goroutine (WithJITBackground): its tests, and the
      # differential tests that compile in the background among their
      # settings.
      - name: Test compiling in the background
        run: go test -tags quickjs_jit -race -count=1 -timeout 15m -run 'Background|Differential' ./internal/vm .
